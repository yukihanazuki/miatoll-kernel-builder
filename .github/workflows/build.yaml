name: Build Miatoll Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Custom kernel name (zip filename & kernel suffix)'
        required: true
        default: 'MiatollKernel'
      perf_preset:
        description: 'Performance preset'
        required: true
        default: 'balanced'
        type: choice
        options:
          - performance
          - balanced
          - battery
      root_manager:
        description: 'Root manager (patch di kernel source)'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - kernelsu
          - susfs
          - bakasu
          - sukisu-nova
      release:
        description: 'Publish to GitHub Releases as well'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KERNEL_REPO: yukihanazuki/miatoll_neko-kernel
      KERNEL_BRANCH: 16
      DEFCONFIG: vendor/xiaomi/miatoll_defconfig
      DTB_FILE: arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb
      ANYKERNEL3_REPO: https://github.com/userariii/AnyKernel3.git
      ANYKERNEL3_BRANCH: master
      CLANG_URL: https://github.com/userariii/AOSP-clang/releases/download/clang-r530567/clang-r530567.tar.gz
      GCC64_URL: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git
      GCC32_URL: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git
      KSU_REPO: https://github.com/tiann/KernelSU.git
      SUSFS_REPO: https://github.com/sidex15/susfs4ksu-module.git
      BAKASU_REPO: https://github.com/Baka-SU/BakaSU.git
      SUKISU_REPO: https://github.com/SukiSU-Nova/SukiSU-Nova.git
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 1

      - name: Clone toolchains (clang + gcc 4.9)
        working-directory: kernel
        run: |
          # AOSP clang (same toolchain family used by this device's builds)
          mkdir clang && cd clang
          wget -q ${{ env.CLANG_URL }} -O clang.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          cd ..

          # LineageOS gcc 4.9 cross compilers
          git clone --depth=1 ${{ env.GCC64_URL }} gcc64
          git clone --depth=1 ${{ env.GCC32_URL }} gcc32

      - name: Install host build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev libncurses-dev \
            libelf-dev xz-utils device-tree-compiler zip unzip wget curl patch

      - name: Prepare defconfig & apply performance preset
        working-directory: kernel
        run: |
          chmod +x scripts/config 2>/dev/null || true

          # Load defconfig from vendor subtree
          mkdir -p out
          cp arch/arm64/configs/${DEFCONFIG} out/.config

          # Custom kernel suffix via CONFIG_LOCALVERSION
          scripts/config --file out/.config --set-str LOCALVERSION "-${{ inputs.kernel_name }}"

          # Performance presets
          case "${{ inputs.perf_preset }}" in
            performance)
              scripts/config --file out/.config \
                --enable CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
                --disable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
                --disable CPU_FREQ_DEFAULT_GOV_POWERSAVE \
                --disable DEBUG_INFO \
                --disable DEBUG_KERNEL
              ;;
            balanced)
              scripts/config --file out/.config \
                --enable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
                --disable CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
                --disable CPU_FREQ_DEFAULT_GOV_POWERSAVE \
                --disable DEBUG_INFO \
                --disable DEBUG_KERNEL
              ;;
            battery)
              scripts/config --file out/.config \
                --enable CPU_FREQ_DEFAULT_GOV_POWERSAVE \
                --disable CPU_FREQ_DEFAULT_GOV_PERFORMANCE \
                --disable CPU_FREQ_DEFAULT_GOV_SCHEDUTIL \
                --disable DEBUG_INFO \
                --disable DEBUG_KERNEL
              ;;
          esac

          make ARCH=arm64 O=out olddefconfig >/dev/null 2>&1

          echo "--- Applied kernel config ---"
          grep -E "CONFIG_LOCALVERSION|CPU_FREQ_DEFAULT_GOV|DEBUG_INFO|DEBUG_KERNEL" out/.config

      - name: Apply KernelSU
        if: ${{ inputs.root_manager == 'kernelsu' }}
        working-directory: kernel
        run: |
          echo "🔧 Applying KernelSU..."
          git clone --depth=1 ${{ env.KSU_REPO }} ksu_source

          # KernelSU core -> drivers/kernelsu/ (contains Kconfig, Kbuild, Makefile, core/, include/, hook/, ...)
          mkdir -p drivers/kernelsu
          cp -r ksu_source/kernel/* drivers/kernelsu/ 2>/dev/null || true

          # Add Kconfig source line
          KCONFIG_FILE="drivers/Kconfig"
          if grep -q "kernelsu" "$KCONFIG_FILE" 2>/dev/null; then
            echo "✅ Kconfig already has kernelsu"
          else
            # Insert after "source \"drivers/\" section or at end of file
            # Simple approach: append source line before the last line
            echo "" >> "$KCONFIG_FILE"
            echo "# KernelSU" >> "$KCONFIG_FILE"
            echo "source \"drivers/kernelsu/Kconfig\"" >> "$KCONFIG_FILE"
          fi

          # Add Makefile obj line
          KMAKEFILE="drivers/Makefile"
          if grep -q "kernelsu" "$KMAKEFILE" 2>/dev/null; then
            echo "✅ Makefile already has kernelsu"
          else
            echo "" >> "$KMAKEFILE"
            echo "# KernelSU" >> "$KMAKEFILE"
            echo "obj-$(CONFIG_KERNELSU) += kernelsu/" >> "$KMAKEFILE"
          fi

          # Enable config via scripts/config
          scripts/config --file out/.config \
            --enable CONFIG_KERNELSU \
            --enable CONFIG_KERNELSU_LKM \
            --set-str CONFIG_KERNELSU_VERSION_CODE 10000 \
            --disable DEBUG_INFO \
            --disable DEBUG_KERNEL

          make ARCH=arm64 O=out olddefconfig >/dev/null 2>&1
          echo "✅ KernelSU applied with Kconfig/Makefile integration"

      - name: Apply SUSFS
        if: ${{ inputs.root_manager == 'susfs' }}
        working-directory: kernel
        run: |
          echo "🔧 Applying SUSFS..."
          git clone --depth=1 ${{ env.SUSFS_REPO }} susfs_source

          # Copy SUSFS sources (module style) into drivers/misc/susfs
          mkdir -p drivers/misc/susfs
          cp -r susfs_source/* drivers/misc/susfs/ 2>/dev/null || true

          scripts/config --file out/.config \
            --enable CONFIG_SUSFS \
            --disable DEBUG_INFO \
            --disable DEBUG_KERNEL

          make ARCH=arm64 O=out olddefconfig >/dev/null 2>&1
          echo "✅ SUSFS applied"

      - name: Apply BakaSU
        if: ${{ inputs.root_manager == 'bakasu' }}
        working-directory: kernel
        run: |
          echo "🔧 Applying BakaSU..."
          git clone --depth=1 ${{ env.BAKASU_REPO }} bakasu_source

          mkdir -p drivers/misc/bakasu
          cp -r bakasu_source/* drivers/misc/bakasu/ 2>/dev/null || true

          scripts/config --file out/.config \
            --enable CONFIG_BAKASU \
            --disable DEBUG_INFO \
            --disable DEBUG_KERNEL

          make ARCH=arm64 O=out olddefconfig >/dev/null 2>&1
          echo "✅ BakaSU applied"

      - name: Apply SukiSu Nova
        if: ${{ inputs.root_manager == 'sukisu-nova' }}
        working-directory: kernel
        run: |
          echo "🔧 Applying SukiSu Nova..."
          git clone --depth=1 ${{ env.SUKISU_REPO }} sukisu_source

          mkdir -p drivers/misc/sukisu
          cp -r sukisu_source/* drivers/misc/sukisu/ 2>/dev/null || true

          scripts/config --file out/.config \
            --enable CONFIG_SUKISU_NOVA \
            --disable DEBUG_INFO \
            --disable DEBUG_KERNEL

          make ARCH=arm64 O=out olddefconfig >/dev/null 2>&1
          echo "✅ SukiSu Nova applied"

      - name: Build kernel
        working-directory: kernel
        run: |
          KERNEL_DIR="$(pwd)"

          # Locate clang binary dir (tarball may extract with or without version subfolder)
          CLANG_BIN="${KERNEL_DIR}/clang/bin"
          if [ ! -x "${CLANG_BIN}/clang" ]; then
            for d in "${KERNEL_DIR}"/clang/*/; do
              if [ -x "${d}bin/clang" ]; then
                CLANG_BIN="${d}bin"
                break
              fi
            done
          fi
          export PATH="${CLANG_BIN}:${KERNEL_DIR}/gcc64/bin:${KERNEL_DIR}/gcc32/bin:$PATH"

          echo "CC: $(command -v clang)"
          clang --version | head -n 2

          if [ "$(cat /sys/devices/system/cpu/smt/active 2>/dev/null)" = "1" ]; then
            THREADS=$(( $(nproc --all) * 2 ))
          else
            THREADS=$(nproc --all)
          fi
          echo "Build threads: $THREADS"

          make O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=clang HOSTCXX=clang++ \
            HOSTCFLAGS="-fuse-ld=lld -Wno-unused-command-line-argument" \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf OBJSIZE=llvm-size \
            Image.gz dtbs dtbo.img > build.log 2>&1 || {
              echo "❌ Build failed. Last lines of build.log:"
              tail -n 80 build.log
              exit 1
            }

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "❌ Build failed: Image.gz not produced"
            tail -n 80 build.log
            exit 1
          fi

          echo "✅ Build completed: Image.gz produced"

      - name: Package with AnyKernel3
        run: |
          KNAME="${{ inputs.kernel_name }}"
          ROOTMGR="${{ inputs.root_manager }}"
          DATE=$(date +%Y%m%d-%H%M)
          ZIP="${KNAME}-miatoll-${ROOTMGR}-${DATE}.zip"

          # Sanitize tag name (no spaces / special chars for Git tags)
          TAGNAME=$(echo "kernel-${KNAME}-${ROOTMGR}-${DATE}" | tr ' ' '-' | sed 's/[^A-Za-z0-9._-]/-/g')
          echo "TAGNAME=${TAGNAME}" >> $GITHUB_ENV
          echo "ZIP_NAME=${ZIP}" >> $GITHUB_ENV

          git clone --depth=1 -b ${{ env.ANYKERNEL3_BRANCH }} ${{ env.ANYKERNEL3_REPO }} AnyKernel3
          mkdir -p AnyKernel3/dtb

          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true

          DTB_NAME="$(basename ${{ env.DTB_FILE }})"
          cp kernel/out/arch/arm64/boot/dts/qcom/${DTB_NAME} AnyKernel3/dtb/ 2>/dev/null || true

          # Ganti kernel.string dengan nama kernel custom dari input
          cd AnyKernel3
          sed -i "s/kernel.string=.*/kernel.string=${KNAME} Kernel/" anykernel.sh
          cd ..

          cd AnyKernel3
          # Zip semua file (termasih META-INF, tools, anykernel.sh, image, dtb, dll)
          # Kecuali .git agar tidak ikut dalam zip
          find . -path ./.git -prune -o -type f -print | zip -r9 "${ZIP}" -@
          md5sum "${ZIP}" > "${ZIP}.md5"
          cd ..

          echo "ZIP_PATH=AnyKernel3/${ZIP}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Create GitHub Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAGNAME }}
          name: ${{ inputs.kernel_name }} Kernel for Miatoll (SM6250)
          body: |
            **Built from** ${{ env.KERNEL_REPO }}@${{ env.KERNEL_BRANCH }}

            **Kernel name**: ${{ inputs.kernel_name }}

            **Performance preset**: ${{ inputs.perf_preset }}

            **Root manager**: ${{ inputs.root_manager }}

            **Workflow run**: ${{ github.run_id }} (#${{ github.run_number }})

            Download the flashable zip below or from the Actions tab.
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}